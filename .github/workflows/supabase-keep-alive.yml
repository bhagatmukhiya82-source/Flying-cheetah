name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 06:00 UTC every 3 days (well within Supabase's 7-day inactivity pause window)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase PostgREST API
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_6ghMNZuKcGbY9dEwdLiTGA_VbaGeTuQ' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_6ghMNZuKcGbY9dEwdLiTGA_VbaGeTuQ' }}" \
            "https://txqtkpxdyoatzdgkcsry.supabase.co/rest/v1/leads_inquiries?select=id&limit=1")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "Supabase HTTP Status: $HTTP_STATUS"
          echo "Supabase Response: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Supabase successfully pinged! Database activity counter reset."
          else
            echo "⚠️ Unexpected HTTP status: $HTTP_STATUS"
            exit 1
          fi
